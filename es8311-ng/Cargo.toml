[package]
name = "es8311-ng"
description = "A platform-agnostic embedded-hal driver for the Everest Semiconductor ES8311 audio codec"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal-driver", "es8311", "audio", "codec", "i2c"]
readme = "README.md"
# The tests need the unpublished es8311-sim crate.
exclude = ["tests/"]
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt", "es8311-registers/defmt"]

[dependencies]
es8311-registers.workspace = true
defmt = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async = { workspace = true, optional = true }

[dev-dependencies]
es8311-sim.workspace = true
embassy-futures.workspace = true
embedded-hal-async.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/es8311/releases/tag/v{{version}}", exactly = 1 },
]
